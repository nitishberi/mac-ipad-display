name: Build DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the DMG (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build app + DMG
        env:
          VERSION: ${{ github.event.inputs.version || '1.0.0' }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          chmod +x Scripts/make-app.sh Scripts/make-dmg.sh
          ./Scripts/make-dmg.sh
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -lh dist/

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacIPadDisplay-${{ env.VERSION }}-dmg
          path: dist/MacIPadDisplay-*.dmg
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MacIPadDisplay-*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
